[project]
name = "fincoach-backend"
version = "0.1.0"
description = "FinCoach AI finance assistant — Python sidecar"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    # LLM / Agents
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.40",
    "langgraph-supervisor>=0.0.5",
    # Vector store
    "chromadb>=0.5.0",
    # DB
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Data sources
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "numpy-financial>=1.0.0",
    # Quant layer (app/quant): SLSQP for long-only mean-variance, brentq for
    # implied vol, stats.t for exact regression t-stats. Deliberately the ONLY
    # place scipy is used — app/eval/scorecard.py keeps its hand-rolled
    # normal CDF/PPF so the metric kernel stays dependency-free.
    "scipy>=1.16.0",
    "requests>=2.32.0",
    "feedparser>=6.0.0",
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Caching
    "joblib>=1.4.0",
    # Background scheduling (news collector poll loop — thread-based, single process)
    "apscheduler>=3.10",
    "tefas-crawler>=0.6.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    # Native Gemini SDK for one-shot document parsing (multimodal + structured output)
    "google-genai>=0.8.0",
    # Auth
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "firebase-admin>=6.5.0",
    # PostgreSQL (Neon) — used when DATABASE_URL is set
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "yfinance>=1.3.0",
    "pdfplumber>=0.11.0",
    "iyzipay>=1.0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Enum classes deliberately inherit (str, Enum) for JSON/DB value identity.
# Migrating to StrEnum changes str()/serialization semantics on persisted
# columns, so suppress UP042 here rather than risk altering stored values.
"app/db/models.py" = ["UP042"]
# Option-pricing code uses the universal Black-Scholes notation (S spot,
# K strike, T time to expiry). Lower-casing those to satisfy pep8-naming makes
# every formula harder to check against the literature than the convention it
# would enforce, so N803/N806 are suppressed here and nowhere else.
"app/quant/options.py" = ["N803"]
"tests/test_quant_options.py" = ["N806"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter helpers are designed to be called in argument
# defaults — exempt them from B008 (ruff's documented FastAPI recommendation).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that hit live external APIs (yfinance, NewsAPI, CoinGecko)",
    "slow: tests that take >5s to complete",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
