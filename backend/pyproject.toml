[project]
name = "fincoach-backend"
version = "0.1.0"
description = "FinCoach AI finance assistant — Python sidecar"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    # LLM / Agents
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.40",
    "langgraph-supervisor>=0.0.5",
    # Vector store
    "chromadb>=0.5.0",
    # DB
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Data sources
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.32.0",
    "feedparser>=6.0.0",
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Caching
    "joblib>=1.4.0",
    "tefas-crawler>=0.6.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    # Native Gemini SDK for one-shot document parsing (multimodal + structured output)
    "google-genai>=0.8.0",
    # Auth
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "firebase-admin>=6.5.0",
    # PostgreSQL (Neon) — used when DATABASE_URL is set
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that hit live external APIs (yfinance, NewsAPI, CoinGecko)",
    "slow: tests that take >5s to complete",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
