name: Deploy Backend → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  # Allow triggering manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    outputs:
      service_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to Google Cloud ────────────────────────────────────
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Configure Docker to push to Artifact Registry ───────────────────
      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # ── Build & push image ───────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t europe-west1-docker.pkg.dev/fincoach-esat/fincoach/backend:${{ github.sha }} \
            -t europe-west1-docker.pkg.dev/fincoach-esat/fincoach/backend:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push europe-west1-docker.pkg.dev/fincoach-esat/fincoach/backend:${{ github.sha }}
          docker push europe-west1-docker.pkg.dev/fincoach-esat/fincoach/backend:latest

      # ── Deploy to Cloud Run ──────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: fincoach-backend
          region: europe-west1
          image: europe-west1-docker.pkg.dev/fincoach-esat/fincoach/backend:${{ github.sha }}
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
            FINCOACH_JWT_SECRET=${{ secrets.JWT_SECRET }}
            GEMINI_MODEL=gemini-3.1-flash-lite-preview
            FIREBASE_PROJECT_ID=fincoach-esat
          flags: >-
            --allow-unauthenticated
            --min-instances=1
            --max-instances=3
            --memory=1Gi
            --timeout=300

      - name: Show deployed URL
        run: echo "Backend deployed → ${{ steps.deploy.outputs.url }}"
